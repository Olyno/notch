[workspace]
resolver = "3"
members = ["crates/notch-core", "crates/notch-relay", "crates/notch-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notch-core = { path = "crates/notch-core" }
