[package]
name = "notch-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP stdio server letting agents publish notch notifications"

[dependencies]
notch-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "net"] }

[dev-dependencies]
tokio = { version = "1", features = ["process"] }
