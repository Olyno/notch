[package]
name = "notch-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Self-hosted notification relay: publish over HTTP, subscribe over WebSocket, replay on reconnect"

[dependencies]
notch-core.workspace = true
serde_json.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
parking_lot = "0.12.5"

[dev-dependencies]
tokio-tungstenite = "0.30.0"
tower = "0.5.3"
